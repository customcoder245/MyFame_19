apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Workaround: Stripe's Compose compiler currently expects an older Kotlin version (e.g. 1.7.20)
// than the one used by this project (1.9.x). This suppresses the compatibility check only for
// the Stripe React Native module so the build can succeed.
subprojects { subproject ->
    if (subproject.name == "stripe_stripe-react-native") {
        afterEvaluate {
            tasks.withType(KotlinCompile).configureEach { task ->
                def args = task.kotlinOptions.freeCompilerArgs
                def flag = "-P"
                def option = "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                if (!args.contains(flag) || !args.contains(option)) {
                    task.kotlinOptions.freeCompilerArgs += [flag, option]
                }
            }
        }
    }
}
